{% macro month_picker(endpoint, nav) %}
<p>
  <a href="{{ url_for(endpoint, year=nav.previous[0], month=nav.previous[1]) }}">&laquo; Föregående</a>
  <form method="get" action="{{ url_for(endpoint) }}" style="display:inline">
    <input name="year" value="{{ nav.year }}" size="5" aria-label="År">
    <select name="month" aria-label="Månad">
      {% for m in range(1, 13) %}
        <option value="{{ m }}" {% if m == nav.month %}selected{% endif %}>{{ month_name(m) }}</option>
      {% endfor %}
    </select>
    <button type="submit">Visa</button>
  </form>
  <a href="{{ url_for(endpoint, year=nav.next[0], month=nav.next[1]) }}">Nästa &raquo;</a>
</p>
{% endmacro %}
