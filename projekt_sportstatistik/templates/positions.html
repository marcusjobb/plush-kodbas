{% extends "base.html" %}
{% block title %}Positioner{% endblock %}
{% block content %}
<h1>Positioner</h1>
<table>
  <thead><tr><th>Namn</th><th></th></tr></thead>
  <tbody>
  {% for p in positions %}
    <tr><td>{{ p.name }}</td><td><a href="{{ url_for('position_delete', position_id=p.id) }}">Ta bort</a></td></tr>
  {% endfor %}
  </tbody>
</table>
<h2>Lägg till position</h2>
<form method="post">
  <input name="name" placeholder="Till exempel Libero" aria-label="Namn">
  <button type="submit">Lägg till</button>
</form>
{% endblock %}
