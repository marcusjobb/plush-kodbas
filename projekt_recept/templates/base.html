<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Recept{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav>
  <a href="{{ url_for('index') }}">Recept</a>
  <a href="{{ url_for('recipe_list') }}">Receptlista</a>
  <a href="{{ url_for('chefs_page') }}">Kockar</a>
  <a href="{{ url_for('categories_page') }}">Kategorier</a>
  <a href="{{ url_for('mealplan_page') }}">Veckoplan</a>
  <a href="{{ url_for('shoppinglist_page') }}">Inköpslista</a>
</nav>
<main>
  {% for category, message in get_flashed_messages(with_categories=true) %}
    <p class="{{ category }}">{{ message }}</p>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
